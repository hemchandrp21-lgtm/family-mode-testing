<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Set a duration - Family Mode</title>
  <!-- Load Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    ::-webkit-scrollbar,
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }
    html, body, * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    body {
      background-color: #000000;
      color: #E2E2E6;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
    }
    /* Day chip button */
    .day-chip {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .day-chip.active {
      background-color: #A8C7FA;
      color: #041E49;
      font-weight: 500;
      border: none;
    }
    .day-chip.inactive {
      background-color: transparent;
      border: 1.5px solid #8C9199;
      color: #FFFFFF;
    }
    /* Minimal radio circle */
    .minimal-radio {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #8C9199;
      border-radius: 50%;
      background-color: transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .minimal-radio:checked {
      border-color: #7CAEFF;
    }
    .minimal-radio:checked::after {
      content: '';
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #7CAEFF;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 bg-black">

<!-- Phone Frame Container -->
<main class="w-full max-w-[392px] h-screen sm:h-[844px] bg-[#121316] sm:rounded-[44px] shadow-2xl relative flex flex-col justify-between overflow-hidden border border-neutral-800/60 select-none">

  <!-- TOP PULL HANDLE (Pull down or click to open Control Center) -->
  <div id="top-status-bar" class="w-full pt-3 pb-1 flex flex-col items-center justify-center select-none cursor-pointer group z-30 transition-colors" title="Drag down or click to open Control Center" onclick="openControlCenter()">
    <div class="w-10 h-1 bg-white/20 group-hover:bg-[#7CAEFF] rounded-full transition-colors duration-200"></div>
  </div>

  <!-- SLIDING CONTROL CENTER OVERLAY -->
  <div id="control-center-drawer" class="absolute inset-0 bg-[#121316] z-50 transform -translate-y-full transition-transform duration-300 ease-out flex flex-col justify-between overflow-hidden shadow-2xl">
    <iframe id="cc-iframe" src="/screens/screen-8-control-center-quick-settings/" class="w-full h-full border-none"></iframe>
  </div>

  <!-- NAVIGATION HEADER -->
  <header class="w-full px-5 pt-3 pb-2 flex items-center justify-between text-white z-20">
    <a href="/screens/screen-1-family-mode-intro/" aria-label="Go back to Onboarding" class="p-1 -ml-1 text-neutral-200 hover:text-white transition">
      <svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div class="w-6"></div>
  </header>

  <!-- MAIN SCROLLABLE CONTENT (Set a duration with UI Inspo from images) -->
  <div class="flex-1 px-6 pt-2 pb-4 overflow-y-auto">
    
    <h1 class="text-[34px] font-normal text-white tracking-tight leading-tight mb-2">
      Set a duration
    </h1>
    <p class="text-[14.5px] text-[#A0A4A8] leading-relaxed mb-6 font-normal">
      Choose how long Family Mode should stay active.
    </p>

    <!-- INSPIRATION COMPONENT (From User Image 2 & 1): Start/End time & Days of Week -->
    <div class="w-full bg-[#1A1D21] border border-neutral-800/80 rounded-[24px] p-5 mb-5">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[14px] font-medium text-[#8AB4F8]">Routine hours</span>
        <span class="text-[12px] text-[#8C9094]">3 hr, 00 min</span>
      </div>

      <!-- Start & End Time Display (Pixel-matched to Image 2) -->
      <div class="flex items-start justify-between py-2 mb-3">
        <!-- Start Time -->
        <div>
          <span class="text-[13px] text-[#8C9094] block mb-1">Start</span>
          <div class="flex items-baseline">
            <span class="text-[36px] font-normal text-white tracking-tight leading-none">6:00</span>
            <span class="text-[16px] text-white font-normal ml-1.5">PM</span>
          </div>
        </div>

        <!-- End Time -->
        <div>
          <span class="text-[13px] text-[#8C9094] block mb-1">End</span>
          <div class="flex items-baseline">
            <span class="text-[36px] font-normal text-white tracking-tight leading-none">9:00</span>
            <span class="text-[16px] text-white font-normal ml-1.5">PM</span>
          </div>
        </div>
      </div>

      <!-- Timeline with bed & sun icons (Matched to Image 1) -->
      <div class="flex items-center gap-3 my-3 text-[#8C9094]">
        <svg class="w-4 h-4 fill-none stroke-current stroke-[2] flex-shrink-0" viewBox="0 0 24 24">
          <path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/>
        </svg>
        <div class="flex-1 h-[1px] bg-neutral-700"></div>
        <span class="text-[11.5px] text-[#A0A4A8] whitespace-nowrap">Every evening</span>
        <div class="flex-1 h-[1px] bg-neutral-700"></div>
        <svg class="w-4 h-4 fill-none stroke-current stroke-[2] flex-shrink-0" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
      </div>

      <!-- Days of Week Circular Chips (Exact Match to Image 2 & 1) -->
      <div class="flex items-center justify-between pt-2">
        <button type="button" onclick="toggleDay(this)" class="day-chip inactive">S</button>
        <button type="button" onclick="toggleDay(this)" class="day-chip active">M</button>
        <button type="button" onclick="toggleDay(this)" class="day-chip active">T</button>
        <button type="button" onclick="toggleDay(this)" class="day-chip active">W</button>
        <button type="button" onclick="toggleDay(this)" class="day-chip active">T</button>
        <button type="button" onclick="toggleDay(this)" class="day-chip active">F</button>
        <button type="button" onclick="toggleDay(this)" class="day-chip inactive">S</button>
      </div>
    </div>

    <!-- Original 5 Duration Options -->
    <div class="mb-4">
      <h2 class="text-[14px] font-medium text-[#7CAEFF] mb-3">
        Quick options
      </h2>

      <div class="space-y-3">
        <!-- Option 1: 30 minutes -->
        <label class="flex items-center px-4 py-3 bg-[#1A1D21] border border-neutral-800/80 rounded-[18px] cursor-pointer hover:bg-[#20242A] transition">
          <input name="duration" type="radio" value="30m" class="minimal-radio mr-4"/>
          <span class="text-[15px] font-normal text-neutral-200">30 minutes</span>
        </label>

        <!-- Option 2: 1 hour (Default checked) -->
        <label class="flex items-center px-4 py-3 bg-[#1E2530] border border-[#2F3E52] rounded-[18px] cursor-pointer hover:bg-[#20242A] transition">
          <input checked name="duration" type="radio" value="1h" class="minimal-radio mr-4"/>
          <span class="text-[15px] font-normal text-white">1 hour</span>
        </label>

        <!-- Option 3: 2 hours -->
        <label class="flex items-center px-4 py-3 bg-[#1A1D21] border border-neutral-800/80 rounded-[18px] cursor-pointer hover:bg-[#20242A] transition">
          <input name="duration" type="radio" value="2h" class="minimal-radio mr-4"/>
          <span class="text-[15px] font-normal text-neutral-200">2 hours</span>
        </label>

        <!-- Option 4: Until tonight -->
        <label class="flex items-center px-4 py-3 bg-[#1A1D21] border border-neutral-800/80 rounded-[18px] cursor-pointer hover:bg-[#20242A] transition">
          <input name="duration" type="radio" value="until_tonight" class="minimal-radio mr-4"/>
          <span class="text-[15px] font-normal text-neutral-200">
            Until tonight <span class="text-[#8C9199] font-normal">(e.g. 11:59 PM)</span>
          </span>
        </label>

        <!-- Option 5: Custom duration with chevron -->
        <label class="flex items-center justify-between px-4 py-3 bg-[#1A1D21] border border-neutral-800/80 rounded-[18px] cursor-pointer hover:bg-[#20242A] transition">
          <div class="flex items-center">
            <input name="duration" type="radio" value="custom" class="minimal-radio mr-4"/>
            <span class="text-[15px] font-normal text-neutral-200">Custom duration</span>
          </div>
          <svg class="w-4 h-4 text-[#8C9199] stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </label>
      </div>
    </div>

  </div>

  <!-- BOTTOM ACTION: Deep Blue Pill Button (Set / Next) -->
  <footer class="w-full px-6 pt-2 pb-3">
    <a href="/screens/screen-4-family-mode-allow-contacts/" class="w-full py-3.5 rounded-full bg-[#004F7C] hover:bg-[#005E94] active:scale-95 text-white text-[15.5px] font-medium transition shadow-sm flex items-center justify-center text-decoration-none">
      Next
    </a>

    <!-- Bottom Gesture Home Bar -->
    <div class="w-36 h-1 bg-[#4A4E54] rounded-full mx-auto mt-4"></div>
  </footer>

</main>

<script>
  function toggleDay(el) {
    if (el.classList.contains('active')) {
      el.classList.remove('active');
      el.classList.add('inactive');
    } else {
      el.classList.remove('inactive');
      el.classList.add('active');
    }
  }

  function openControlCenter() {
    const drawer = document.getElementById('control-center-drawer');
    if (drawer) {
      drawer.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      drawer.classList.remove('-translate-y-full');
      drawer.classList.add('translate-y-0');
      drawer.style.transform = '';
    }
  }

  function closeControlCenter() {
    const drawer = document.getElementById('control-center-drawer');
    if (drawer) {
      drawer.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      drawer.classList.remove('translate-y-0');
      drawer.classList.add('-translate-y-full');
      drawer.style.transform = '';
    }
  }

  window.addEventListener('message', (e) => {
    if (e.data === 'close-control-center') {
      closeControlCenter();
    } else if (e.data && e.data.action === 'open-family-mode') {
      closeControlCenter();
    }
  });

  // Touch & Mouse Drag Down Gestures
  (function initDrag() {
    const statusBar = document.getElementById('top-status-bar');
    const drawer = document.getElementById('control-center-drawer');
    const mainEl = document.querySelector('main');
    if (!statusBar || !drawer || !mainEl) return;

    let isDragging = false;
    let startY = 0;

    function onStart(clientY) {
      isDragging = true;
      startY = clientY;
      drawer.style.transition = 'none';
    }

    function onMove(clientY) {
      if (!isDragging) return;
      const diff = clientY - startY;
      if (diff > 0) {
        const h = mainEl.clientHeight || 844;
        const translateY = Math.min(0, -h + diff);
        drawer.style.transform = `translateY(${translateY}px)`;
      }
    }

    function onEnd(clientY) {
      if (!isDragging) return;
      isDragging = false;
      const diff = clientY - startY;
      if (diff > 60) {
        openControlCenter();
      } else {
        closeControlCenter();
      }
    }

    statusBar.addEventListener('touchstart', (e) => onStart(e.touches[0].clientY), { passive: true });
    window.addEventListener('touchmove', (e) => { if (isDragging) onMove(e.touches[0].clientY); }, { passive: true });
    window.addEventListener('touchend', (e) => { if (isDragging) onEnd(e.changedTouches[0].clientY); }, { passive: true });

    statusBar.addEventListener('mousedown', (e) => {
      onStart(e.clientY);
      function onMouseMove(ev) { onMove(ev.clientY); }
      function onMouseUp(ev) {
        onEnd(ev.clientY);
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      }
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeControlCenter();
      if (e.key.toLowerCase() === 'c') openControlCenter();
    });
  })();
</script>

</body>
</html>
