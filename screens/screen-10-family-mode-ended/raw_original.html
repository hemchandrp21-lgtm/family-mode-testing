<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Family Mode Ended</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          colors: {
            appBg: '#F9F9F9',
            cardBg: '#FAFAFA',
            primaryDark: '#3A3A3A',
            circleMain: '#828282',
            textTitle: '#000000',
            textBody: '#555555',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Precise Aesthetics -->
<style data-purpose="custom-layout">
    body {
      background-color: #E5E7EB;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Device Frame Simulation */
    .device-container {
      width: 100%;
      max-width: 400px;
      min-height: 844px;
      height: 100vh;
      max-height: 870px;
      background-color: #FAFAFA;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      border-radius: 48px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin: auto;
    }

    @media (max-width: 440px) {
      .device-container {
        border-radius: 0;
        max-height: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-6 font-sans select-none">
<!-- BEGIN: DeviceContainer -->
<main class="device-container" data-purpose="mobile-screen-wrapper">
<!-- BEGIN: StatusBar -->
<header class="pt-3 px-8 flex justify-between items-center text-black shrink-0" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-neutral-900 ml-1">9:41</span>
<!-- Right Status Icons -->
<div class="flex items-center space-x-1.5 mr-0.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5 fill-current text-neutral-900" viewbox="0 0 17 11">
<rect height="3" rx="0.5" width="3" x="0" y="8"></rect>
<rect height="5.5" rx="0.5" width="3" x="4.5" y="5.5"></rect>
<rect height="8" rx="0.5" width="3" x="9" y="3"></rect>
<rect height="11" rx="0.5" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-current text-neutral-900" viewbox="0 0 16 12">
<path d="M8 2.8c2.4 0 4.6.9 6.2 2.4l1.3-1.3C13.6 2 10.9 1 8 1 5.1 1 2.4 2 .5 3.9l1.3 1.3C3.4 3.7 5.6 2.8 8 2.8zM8 6.2c1.5 0 2.9.6 3.9 1.6l1.3-1.3C11.8 5.1 10 4.4 8 4.4s-3.8.7-5.2 2.1l1.3 1.3C5.1 6.8 6.5 6.2 8 6.2zM8 9.6c.9 0 1.6.4 2.2 1l1.4-1.4C10.7 8.3 9.4 7.8 8 7.8s-2.7.5-3.6 1.4l1.4 1.4c.6-.6 1.3-1 2.2-1z"></path>
<circle cx="8" cy="11.5" r="1.1"></circle>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-5 h-[11px] border border-neutral-900 rounded-[3px] p-[1px] flex items-center">
<div class="h-full w-full bg-neutral-900 rounded-[1px]"></div>
</div>
<div class="w-[1.5px] h-1 bg-neutral-900 rounded-r-sm -ml-[0.5px]"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: TopStepIndicator -->
<section class="mt-4 flex justify-center items-center px-8" data-purpose="step-indicator">
<div class="flex items-center space-x-2">
<!-- Step 1: Active -->
<div class="w-11 h-[3px] bg-neutral-900 rounded-full"></div>
<!-- Step 2: Active -->
<div class="w-11 h-[3px] bg-neutral-900 rounded-full"></div>
<!-- Step 3: Inactive -->
<div class="w-11 h-[3px] bg-neutral-300 rounded-full"></div>
</div>
</section>
<!-- END: TopStepIndicator -->
<!-- BEGIN: ContentArea -->
<section class="flex-1 flex flex-col justify-center items-center px-8 text-center pb-8" data-purpose="main-confirmation-content">
<!-- Central Layered Circular Graphic -->
<div class="relative w-64 h-56 flex items-center justify-center mb-6" data-purpose="success-illustration">
<!-- Background Circle: Top Right Large Pale Gray -->
<div class="absolute w-32 h-32 rounded-full bg-[#EAEAEA] top-0 right-4"></div>
<!-- Background Circle: Left Middle Small Pale Gray -->
<div class="absolute w-20 h-20 rounded-full bg-[#ECECEC] bottom-10 left-2"></div>
<!-- Background Circle: Top Left Tiny Bubble -->
<div class="absolute w-8 h-8 rounded-full bg-[#E5E5E5] top-6 left-12"></div>
<!-- Background Circle: Bottom Right Tiny Bubble -->
<div class="absolute w-7 h-7 rounded-full bg-[#E2E2E2] bottom-9 right-8"></div>
<!-- Foreground Primary Circle with Checkmark -->
<div class="relative z-10 w-32 h-32 rounded-full bg-[#838383] shadow-sm flex items-center justify-center">
<svg class="w-14 h-14 text-white stroke-[4.5]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
</div>
<!-- Headline -->
<h1 class="text-[28px] font-bold text-neutral-950 tracking-tight leading-snug mb-3.5">
        Family Mode Ended
      </h1>
<!-- Description / Body Text -->
<p class="text-[17px] font-normal leading-relaxed text-[#5F5F5F] max-w-[270px] mx-auto">
        You can now receive all notifications and calls.
      </p>
</section>
<!-- END: ContentArea -->
<!-- BEGIN: BottomActionArea -->
<footer class="px-6 pb-2 pt-0 flex flex-col items-center shrink-0" data-purpose="actions-and-home-bar">
<!-- OK Button -->
<button class="w-full h-14 bg-[#383838] hover:bg-[#282828] active:bg-[#1a1a1a] transition-colors rounded-2xl flex items-center justify-center text-white text-[17px] font-semibold tracking-wide shadow-sm" data-purpose="confirm-button" type="button">
        OK
      </button>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-black/20 rounded-full mt-7 mb-2" data-purpose="home-indicator"></div>
</footer>
<!-- END: BottomActionArea -->
</main>
<!-- END: DeviceContainer -->
</body></html>
