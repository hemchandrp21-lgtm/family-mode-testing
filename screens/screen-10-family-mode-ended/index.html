<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Family Mode Ended</title>
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Roboto (matching Screen 1 Intro) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared-interactions.css">
  <link rel="stylesheet" href="/shared-interactions.css">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    /* Universal scrollbar elimination */
    ::-webkit-scrollbar,
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }
    html, body, * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    body {
      background-color: #000000;
      color: #E2E2E6;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 bg-black">

<!-- Phone Frame Container -->
<main class="w-full max-w-[392px] h-screen sm:h-[844px] bg-[#121316] sm:rounded-[44px] shadow-2xl relative flex flex-col justify-between overflow-hidden border border-neutral-800/80 select-none">

  <!-- TOP PULL HANDLE (Pull down or click to open Control Center) -->
  <div id="top-status-bar" class="w-full pt-3 pb-1 flex flex-col items-center justify-center select-none cursor-pointer group z-30 transition-colors" title="Drag down or click to open Control Center" onclick="openControlCenter()">
    <div class="w-10 h-1 bg-white/20 group-hover:bg-[#7CAEFF] rounded-full transition-colors duration-200"></div>
  </div>

  <!-- SLIDING CONTROL CENTER OVERLAY -->
  <div id="control-center-drawer" class="absolute inset-0 bg-[#121316] z-50 transform -translate-y-full transition-transform duration-300 ease-out flex flex-col justify-between overflow-hidden shadow-2xl">
    <iframe id="cc-iframe" src="/screens/screen-8-control-center-quick-settings/" class="w-full h-full border-none"></iframe>
  </div>


  <!-- CENTER CONFIRMATION SECTION -->
  <div class="flex-1 flex flex-col items-center justify-center px-6 -mt-8 pb-36 min-h-0">
    
    <!-- Multi-layered Glowing Emblem with OriginOS Electric Blue Badge & Checkmark -->
    <div class="relative w-48 h-48 flex items-center justify-center mb-4">
      <!-- Background glowing halos -->
      <div class="absolute w-44 h-44 rounded-full bg-gradient-to-tr from-[#5390F5]/15 via-[#7CAEFF]/10 to-transparent blur-md animate-pulse"></div>
      <div class="absolute w-32 h-32 rounded-full border border-[#7CAEFF]/25 bg-[#004F7C]/20"></div>
      <div class="absolute w-12 h-12 rounded-full bg-[#7CAEFF]/15 -top-1 -left-2 blur-xs"></div>
      <div class="absolute w-10 h-10 rounded-full bg-[#5390F5]/20 bottom-3 right-1 blur-xs"></div>

      <!-- Prominent OriginOS Blue Badge with Crisp White Checkmark (Matching Screen 7) -->
      <div class="relative z-10 w-20 h-20 rounded-full bg-[#004F7C] border-2 border-[#7CAEFF] shadow-[0_0_28px_rgba(124,174,255,0.5)] flex items-center justify-center text-white">
        <svg class="w-10 h-10 stroke-white stroke-[3.5] fill-none" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12" stroke-linecap="round" stroke-linejoin="round"></polyline>
        </svg>
      </div>
    </div>

    <!-- Title & Subtitle with Crisp Contrast -->
    <h1 class="text-[28px] font-bold text-white tracking-tight text-center mb-2">
      Family Mode Ended
    </h1>
    <p class="text-[14.5px] text-[#A0A4A8] text-center max-w-[250px] leading-relaxed font-normal">
      You can now receive all notifications and calls.
    </p>

  </div>

  <!-- BOTTOM ACTION BUTTONS: Sticky OriginOS Actions -->
  <footer class="origin-sticky-cta-footer">
    <button onclick="handleDone()" class="cta-secondary-pill-btn">
      Done
    </button>
    <button onclick="handleViewSummary()" class="origin-primary-pill-btn">
      View Missed Summary
    </button>

    <!-- Bottom Gesture Home Bar -->
    <div class="home-indicator-bar"></div>
  </footer>

</main>

<script>
  function handleViewSummary() {
    try {
      localStorage.setItem('familyModeActive', 'false');
      localStorage.setItem('familyModeSetupComplete', 'true');
    } catch(e) {}
    if (window.smoothNavigate) {
      window.smoothNavigate('/screens/screen-11-family-mode-summary/', 'down');
    } else {
      window.location.href = '/screens/screen-11-family-mode-summary/';
    }
  }

  function handleDone() {
    try {
      localStorage.setItem('familyModeActive', 'false');
      localStorage.setItem('familyModeSetupComplete', 'true');
    } catch(e) {}
    if (window.smoothNavigate) {
      window.smoothNavigate('/screens/screen-0-phone-home-screen/', 'forward');
    } else {
      window.location.href = '/screens/screen-0-phone-home-screen/';
    }
  }

  // Control Center Drawer Interactions
  const drawer = document.getElementById('control-center-drawer');
  let isDrawerOpen = false;

  function openControlCenter() {
    isDrawerOpen = true;
    drawer.classList.remove('-translate-y-full');
    drawer.classList.add('translate-y-0');
  }

  function closeControlCenter() {
    isDrawerOpen = false;
    drawer.classList.add('-translate-y-full');
    drawer.classList.remove('translate-y-0');
  }

  // Handle messages from iframe
  window.addEventListener('message', (event) => {
    if (event.data === 'close-control-center') {
      closeControlCenter();
    } else if (event.data && event.data.action === 'open-family-mode') {
      closeControlCenter();
    }
  });

  // Pull down touch gesture from top
  let touchStartY = 0;
  window.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    const diff = e.changedTouches[0].clientY - touchStartY;
    if (touchStartY < 90 && diff > 45) {
      openControlCenter();
    }
  }, { passive: true });
</script>

</body>
</html>
