<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Family Mode - Activating</title>
  <!-- Load Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    ::-webkit-scrollbar,
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }
    html, body, * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    body {
      background-color: #000000;
      color: #E2E2E6;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
    }

    @keyframes spin-subtle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loader-spin {
      animation: spin-subtle 1.2s linear infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.55; }
    }
    .ring-pulse {
      animation: pulse-ring 2.4s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 bg-black">

<!-- Phone Frame Container -->
<main class="w-full max-w-[392px] h-screen sm:h-[844px] bg-[#121316] sm:rounded-[44px] shadow-2xl relative flex flex-col justify-between overflow-hidden border border-neutral-800/60 select-none">

  <!-- TOP PULL HANDLE (Pull down or click to open Control Center) -->
  <div id="top-status-bar" class="w-full pt-3 pb-1 flex flex-col items-center justify-center select-none cursor-pointer group z-30 transition-colors" title="Drag down or click to open Control Center" onclick="openControlCenter()">
    <div class="w-10 h-1 bg-white/20 group-hover:bg-[#7CAEFF] rounded-full transition-colors duration-200"></div>
  </div>

  <!-- SLIDING CONTROL CENTER OVERLAY -->
  <div id="control-center-drawer" class="absolute inset-0 bg-[#121316] z-50 transform -translate-y-full transition-transform duration-300 ease-out flex flex-col justify-between overflow-hidden shadow-2xl">
    <iframe id="cc-iframe" src="/screens/screen-8-control-center-quick-settings/" class="w-full h-full border-none"></iframe>
  </div>

  <!-- NAVIGATION HEADER -->
  <header class="w-full px-5 pt-3 pb-2 flex items-center justify-between text-white z-20">
    <!-- Back Button -->
    <a href="/screens/screen-5b-family-mode-caller-status/" aria-label="Go back" class="p-1 -ml-1 text-neutral-200 hover:text-white transition">
      <svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div class="w-6"></div>
  </header>

  <!-- MAIN SCROLLABLE CONTENT -->
  <div class="flex-1 px-6 pt-2 pb-4 overflow-y-auto flex flex-col justify-between">
    
    <!-- Title & Subtitle -->
    <div>
      <h1 class="text-[34px] font-normal text-white tracking-tight leading-tight mb-2">
        Activating<br>Family Mode...
      </h1>
      <p class="text-[14.5px] text-[#A0A4A8] leading-relaxed font-normal">
        Your settings are being applied.
      </p>
    </div>

    <!-- Central Progress Ring with House & Family Line Art -->
    <section class="flex flex-col items-center justify-center my-6 py-1" data-purpose="visual-status-meter">
      <div class="relative w-56 h-56 flex items-center justify-center">
        <!-- Soft Ambient Background Glow -->
        <div class="absolute inset-4 bg-[#7CAEFF]/10 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Circular Progress Ring SVG -->
        <svg aria-hidden="true" class="w-full h-full transform -rotate-90 ring-pulse" viewBox="0 0 200 200">
          <!-- Background Track Circle -->
          <circle cx="100" cy="100" fill="transparent" r="82" stroke="#1F2329" stroke-width="7"></circle>
          <!-- Active Stroke (approx. 78% filled, animating to 100%) -->
          <circle id="progress-circle" cx="100" cy="100" fill="transparent" r="82" stroke="#7CAEFF" stroke-dasharray="515.22" stroke-dashoffset="130" stroke-linecap="round" stroke-width="7" class="transition-all duration-1000 ease-out"></circle>
        </svg>

        <!-- Center Line-Art Icon: House with Family Figures -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none" data-purpose="family-house-icon">
          <svg class="w-24 h-24 text-neutral-100 drop-shadow-md" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" viewBox="0 0 100 100">
            <!-- House Roof and Walls -->
            <path d="M 50 16 L 86 46 L 86 84 L 14 84 L 14 46 Z"></path>
            <!-- Person 1 (Adult Left) -->
            <circle cx="36" cy="48" r="4.2" stroke-width="2.3"></circle>
            <path d="M 28 66 C 28 58 44 58 44 66 L 44 76" stroke-width="2.3"></path>
            <!-- Person 2 (Child Center) -->
            <circle cx="50" cy="54" r="3.5" stroke-width="2.1"></circle>
            <path d="M 43 72 C 43 65 57 65 57 72 L 57 76" stroke-width="2.1"></path>
            <!-- Person 3 (Adult Right) -->
            <circle cx="64" cy="48" r="4.2" stroke-width="2.3"></circle>
            <path d="M 56 66 C 56 58 72 58 72 66 L 72 76" stroke-width="2.3"></path>
          </svg>
        </div>
      </div>
    </section>

    <!-- Activation Checklist Items -->
    <section class="w-full flex flex-col space-y-3.5 mb-4" data-purpose="activation-checklist">
      
      <!-- Step 1: Completed -->
      <div class="flex items-center space-x-3.5 p-1">
        <div class="w-6 h-6 rounded-full bg-[#004F7C] flex items-center justify-center flex-shrink-0">
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <span class="text-[15px] font-normal text-white tracking-tight">Setting duration</span>
      </div>

      <!-- Step 2: Completed -->
      <div class="flex items-center space-x-3.5 p-1">
        <div class="w-6 h-6 rounded-full bg-[#004F7C] flex items-center justify-center flex-shrink-0">
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <span class="text-[15px] font-normal text-white tracking-tight">Applying contact settings</span>
      </div>

      <!-- Step 3: Completed -->
      <div class="flex items-center space-x-3.5 p-1">
        <div class="w-6 h-6 rounded-full bg-[#004F7C] flex items-center justify-center flex-shrink-0">
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <span class="text-[15px] font-normal text-white tracking-tight">Updating message behaviour</span>
      </div>

      <!-- Step 4: In Progress / Loading -->
      <div id="step-4-row" class="flex items-center space-x-3.5 p-1">
        <div id="step-4-icon" class="w-6 h-6 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 loader-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-20" cx="12" cy="12" r="9.5" stroke="#7CAEFF" stroke-width="2.5"></circle>
            <path class="opacity-100" d="M12 2.5 A 9.5 9.5 0 0 1 21.5 12" fill="none" stroke="#7CAEFF" stroke-linecap="round" stroke-width="2.5"></path>
          </svg>
        </div>
        <span id="step-4-label" class="text-[15px] font-normal text-[#A0A4A8] tracking-tight">Preparing caller status</span>
      </div>

    </section>

  </div>

  <!-- BOTTOM ACTION (Deep Blue Pill Button -> Next to Screen 7) -->
  <footer class="w-full px-6 pt-2 pb-3">
    <a id="btn-next" href="/screens/screen-7-family-mode-active-summary/" class="w-full py-3.5 rounded-full bg-[#004F7C] hover:bg-[#005E94] active:scale-95 text-white text-[15.5px] font-medium transition shadow-sm flex items-center justify-center text-decoration-none">
      View Summary
    </a>

    <!-- Bottom Gesture Home Bar -->
    <div class="w-36 h-1 bg-[#4A4E54] rounded-full mx-auto mt-4"></div>
  </footer>

</main>

<script>
  // Automatic step completion effect
  setTimeout(() => {
    // Finish step 4
    const step4Icon = document.getElementById('step-4-icon');
    const step4Label = document.getElementById('step-4-label');
    const progressCircle = document.getElementById('progress-circle');
    const btnNext = document.getElementById('btn-next');

    if (step4Icon && step4Label) {
      step4Icon.className = "w-6 h-6 rounded-full bg-[#004F7C] flex items-center justify-center flex-shrink-0 transition-all duration-300";
      step4Icon.innerHTML = `
        <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      `;
      step4Label.className = "text-[15px] font-normal text-white tracking-tight";
    }

    if (progressCircle) {
      progressCircle.style.strokeDashoffset = '0';
    }

    if (btnNext) {
      if (window.self === window.top) {
        btnNext.innerText = "Done (Continuing...)";
        setTimeout(() => {
          window.location.href = "/screens/screen-7-family-mode-active-summary/";
        }, 1200);
      } else {
        btnNext.innerText = "View Summary";
      }
    }
  }, 2400);

  function openControlCenter() {
    const drawer = document.getElementById('control-center-drawer');
    if (drawer) {
      drawer.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      drawer.classList.remove('-translate-y-full');
      drawer.classList.add('translate-y-0');
      drawer.style.transform = '';
    }
  }

  function closeControlCenter() {
    const drawer = document.getElementById('control-center-drawer');
    if (drawer) {
      drawer.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      drawer.classList.remove('translate-y-0');
      drawer.classList.add('-translate-y-full');
      drawer.style.transform = '';
    }
  }

  window.addEventListener('message', (e) => {
    if (e.data === 'close-control-center') {
      closeControlCenter();
    } else if (e.data && e.data.action === 'open-family-mode') {
      closeControlCenter();
    }
  });

  // Touch & Mouse Drag Down Gestures
  (function initDrag() {
    const statusBar = document.getElementById('top-status-bar');
    const drawer = document.getElementById('control-center-drawer');
    const mainEl = document.querySelector('main');
    if (!statusBar || !drawer || !mainEl) return;

    let isDragging = false;
    let startY = 0;

    function onStart(clientY) {
      isDragging = true;
      startY = clientY;
      drawer.style.transition = 'none';
    }

    function onMove(clientY) {
      if (!isDragging) return;
      const diff = clientY - startY;
      if (diff > 0) {
        const h = mainEl.clientHeight || 844;
        const translateY = Math.min(0, -h + diff);
        drawer.style.transform = `translateY(${translateY}px)`;
      }
    }

    function onEnd(clientY) {
      if (!isDragging) return;
      isDragging = false;
      const diff = clientY - startY;
      if (diff > 60) {
        openControlCenter();
      } else {
        closeControlCenter();
      }
    }

    statusBar.addEventListener('touchstart', (e) => onStart(e.touches[0].clientY), { passive: true });
    window.addEventListener('touchmove', (e) => { if (isDragging) onMove(e.touches[0].clientY); }, { passive: true });
    window.addEventListener('touchend', (e) => { if (isDragging) onEnd(e.changedTouches[0].clientY); }, { passive: true });

    statusBar.addEventListener('mousedown', (e) => {
      onStart(e.clientY);
      function onMouseMove(ev) { onMove(ev.clientY); }
      function onMouseUp(ev) {
        onEnd(ev.clientY);
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      }
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeControlCenter();
      if (e.key.toLowerCase() === 'c') openControlCenter();
    });
  })();
</script>

</body>
</html>
