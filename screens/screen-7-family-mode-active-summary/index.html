<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Family Mode - Active Summary</title>
  <!-- Load Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared-interactions.css">
  <link rel="stylesheet" href="/shared-interactions.css">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    ::-webkit-scrollbar,
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }
    html, body, * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    body {
      background-color: #000000;
      color: #E2E2E6;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 bg-black">

<!-- Phone Frame Container -->
<main class="w-full max-w-[392px] h-screen sm:h-[844px] bg-[#121316] sm:rounded-[44px] shadow-2xl relative flex flex-col justify-between overflow-hidden border border-neutral-800/60 select-none">

  <!-- TOP PULL HANDLE (Pull down or click to open Control Center) -->
  <div id="top-status-bar" class="w-full pt-3 pb-1 flex flex-col items-center justify-center select-none cursor-pointer group z-30 transition-colors" title="Drag down or click to open Control Center" onclick="openControlCenter()">
    <div class="w-10 h-1 bg-white/20 group-hover:bg-[#7CAEFF] rounded-full transition-colors duration-200"></div>
  </div>

  <!-- SLIDING CONTROL CENTER OVERLAY -->
  <div id="control-center-drawer" class="absolute inset-0 bg-[#121316] z-50 transform -translate-y-full transition-transform duration-300 ease-out flex flex-col justify-between overflow-hidden shadow-2xl">
    <iframe id="cc-iframe" src="/screens/screen-8-control-center-quick-settings/" class="w-full h-full border-none"></iframe>
  </div>

  <!-- NAVIGATION HEADER -->
  <header class="w-full px-5 pt-3 pb-2 flex items-center justify-between text-white z-20">
    <a href="/screens/screen-5-family-mode-message-behaviour/" aria-label="Go back" class="p-1 -ml-1 text-neutral-200 hover:text-white transition">
      <svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div class="w-6"></div>
  </header>

  <!-- MAIN SCROLLABLE CONTENT -->
  <div class="flex-1 px-6 pt-1 pb-36 overflow-y-auto min-h-0">
    
    <!-- Central Illustration: House with Family + Verified Badge -->
    <div class="relative w-48 h-32 mx-auto flex items-center justify-center my-1" data-purpose="status-illustration">
      <!-- Soft ambient backdrop blobs -->
      <div class="absolute w-28 h-28 bg-[#1A2230]/70 rounded-full top-1 left-5 blur-xl"></div>
      <div class="absolute w-24 h-24 bg-[#141B26]/80 rounded-full -top-1 right-6 blur-lg"></div>

      <!-- Foreground SVG Graphic -->
      <div class="relative z-10 w-28 h-28 flex items-center justify-center">
        <svg class="w-24 h-24 text-[#7CAEFF] drop-shadow-[0_0_16px_rgba(124,174,255,0.4)]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 100 100">
          <!-- House Roof (Gable) -->
          <polyline points="20,44 50,20 80,44" stroke-width="2.8"></polyline>
          <!-- Left Wall & Baseline -->
          <line x1="26" y1="40" x2="26" y2="65" stroke-width="2.6"></line>
          <line x1="23" y1="65" x2="39" y2="65" stroke-width="2.6"></line>
          <!-- Left Figure (Parent: Head & Shoulders) -->
          <circle cx="48" cy="47" r="6.2" stroke-width="2.6"></circle>
          <path d="M38,65 C38,56 42.5,55 48,55 C53.5,55 58,56 58,65" stroke-width="2.6"></path>
          <!-- Right Figure (Child: Head & Shoulders) -->
          <circle cx="63.5" cy="51" r="5.2" stroke-width="2.4"></circle>
          <path d="M55,65 C55,60 58.5,59 63.5,59 C68.5,59 72,60 72,65" stroke-width="2.4"></path>
        </svg>

        <!-- Verified Check Badge in bottom right -->
        <div class="absolute bottom-1 right-1 bg-[#004F7C] rounded-full w-7 h-7 flex items-center justify-center border-2 border-[#121316] shadow-md" data-purpose="success-badge">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>
    </div>

    <!-- Title Section -->
    <div class="text-center mt-2 mb-4" data-purpose="title-section">
      <h1 class="text-[28px] leading-tight font-normal text-white tracking-tight">
        Family Mode<br>is Active
      </h1>
      <p class="text-[14px] text-[#A0A4A8] font-normal mt-1.5 tracking-tight">
        Enjoy your time with your loved ones.
      </p>
    </div>

    <!-- Active Settings Summary Card -->
    <section aria-label="Active settings summary" class="w-full bg-[#1A1D21] rounded-[22px] px-4 py-1.5 border border-neutral-800/80 shadow-sm" data-purpose="settings-summary-card">
      
      <!-- Row 1: Duration -->
      <div class="flex items-center py-2.5 border-b border-neutral-800/60" data-purpose="summary-row">
        <div class="w-10 h-10 rounded-full bg-[#121316] border border-neutral-800/90 flex items-center justify-center flex-shrink-0 mr-3.5 text-[#7CAEFF]">
          <svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[14.5px] font-normal text-white leading-snug">Duration</span>
          <span class="text-[12.5px] text-[#8C9094] font-normal leading-tight">1 hour (Ends at 3:39 PM)</span>
        </div>
      </div>

      <!-- Row 2: Allowed Contacts -->
      <div class="flex items-center py-2.5 border-b border-neutral-800/60" data-purpose="summary-row">
        <div class="w-10 h-10 rounded-full bg-[#121316] border border-neutral-800/90 flex items-center justify-center flex-shrink-0 mr-3.5 text-[#7CAEFF]">
          <svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[14.5px] font-normal text-white leading-snug">Allowed contacts</span>
          <span class="text-[12.5px] text-[#8C9094] font-normal leading-tight">Family, Close Friends</span>
        </div>
      </div>

      <!-- Row 3: Message Behaviour -->
      <div class="flex items-center py-2.5 border-b border-neutral-800/60" data-purpose="summary-row">
        <div class="w-10 h-10 rounded-full bg-[#121316] border border-neutral-800/90 flex items-center justify-center flex-shrink-0 mr-3.5 text-[#7CAEFF]">
          <svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            <line stroke-width="2.5" x1="8" x2="8.01" y1="12" y2="12"></line>
            <line stroke-width="2.5" x1="12" x2="12.01" y1="12" y2="12"></line>
            <line stroke-width="2.5" x1="16" x2="16.01" y1="12" y2="12"></line>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[14.5px] font-normal text-white leading-snug">Message behaviour</span>
          <span class="text-[12.5px] text-[#8C9094] font-normal leading-tight">Mark as undelivered</span>
        </div>
      </div>

      <!-- Row 4: Caller Status -->
      <div class="flex items-center py-2.5" data-purpose="summary-row">
        <div class="w-10 h-10 rounded-full bg-[#121316] border border-neutral-800/90 flex items-center justify-center flex-shrink-0 mr-3.5 text-[#7CAEFF]">
          <svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[14.5px] font-normal text-white leading-snug">Caller status</span>
          <span class="text-[12.5px] text-[#8C9094] font-normal leading-tight">Show Family Mode status</span>
        </div>
      </div>

    </section>

  </div>

  <!-- BOTTOM ACTION BUTTONS: Sticky OriginOS Actions -->
  <footer class="origin-sticky-cta-footer">
    <!-- Secondary Edit Settings Button -->
    <a href="/screens/screen-3-family-mode-set-duration/" class="cta-secondary-pill-btn">
      Edit Settings
    </a>

    <!-- Primary Done Button (Anchored in same sticky slot as Next) -->
    <a href="/screens/screen-8-control-center-quick-settings/" onclick="handleDone(event)" class="origin-primary-pill-btn">
      Done
    </a>

    <!-- Bottom Gesture Home Bar -->
    <div class="home-indicator-bar"></div>
  </footer>

</main>

<script>
  function openControlCenter() {
    const drawer = document.getElementById('control-center-drawer');
    if (drawer) {
      drawer.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      drawer.classList.remove('-translate-y-full');
      drawer.classList.add('translate-y-0');
      drawer.style.transform = '';
    }
  }

  function closeControlCenter() {
    const drawer = document.getElementById('control-center-drawer');
    if (drawer) {
      drawer.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      drawer.classList.remove('translate-y-0');
      drawer.classList.add('-translate-y-full');
      drawer.style.transform = '';
    }
  }

  window.addEventListener('message', (e) => {
    if (e.data === 'close-control-center') {
      closeControlCenter();
    } else if (e.data && e.data.action === 'open-family-mode') {
      closeControlCenter();
      window.location.href = e.data.screen || '/screens/screen-9-family-mode-active-status/';
    }
  });

  function handleDone(e) {
    if (e) e.preventDefault();
    try {
      localStorage.setItem('familyModeSetupComplete', 'true');
      localStorage.setItem('familyModeActive', 'true');
    } catch(err) {}
    if (window.smoothNavigate) {
      window.smoothNavigate('/screens/screen-0-phone-home-screen/', 'forward');
    } else {
      window.location.href = '/screens/screen-0-phone-home-screen/';
    }
  }

  // Touch & Mouse Drag Down Gestures
  (function initDrag() {
    const statusBar = document.getElementById('top-status-bar');
    const drawer = document.getElementById('control-center-drawer');
    const mainEl = document.querySelector('main');
    if (!statusBar || !drawer || !mainEl) return;

    let isDragging = false;
    let startY = 0;

    function onStart(clientY) {
      isDragging = true;
      startY = clientY;
      drawer.style.transition = 'none';
    }

    function onMove(clientY) {
      if (!isDragging) return;
      const diff = clientY - startY;
      if (diff > 0) {
        const h = mainEl.clientHeight || 844;
        const translateY = Math.min(0, -h + diff);
        drawer.style.transform = `translateY(${translateY}px)`;
      }
    }

    function onEnd(clientY) {
      if (!isDragging) return;
      isDragging = false;
      const diff = clientY - startY;
      if (diff > 60) {
        openControlCenter();
      } else {
        closeControlCenter();
      }
    }

    statusBar.addEventListener('touchstart', (e) => onStart(e.touches[0].clientY), { passive: true });
    window.addEventListener('touchmove', (e) => { if (isDragging) onMove(e.touches[0].clientY); }, { passive: true });
    window.addEventListener('touchend', (e) => { if (isDragging) onEnd(e.changedTouches[0].clientY); }, { passive: true });

    statusBar.addEventListener('mousedown', (e) => {
      onStart(e.clientY);
      function onMouseMove(ev) { onMove(ev.clientY); }
      function onMouseUp(ev) {
        onEnd(ev.clientY);
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      }
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeControlCenter();
      if (e.key.toLowerCase() === 'c') openControlCenter();
    });
  })();
</script>

</body>
</html>
