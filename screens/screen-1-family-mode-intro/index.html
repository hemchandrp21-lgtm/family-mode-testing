<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Family Mode - Onboarding</title>
  <!-- Load Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    ::-webkit-scrollbar,
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }
    html, body, * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    body {
      background-color: #000000;
      color: #E2E2E6;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 bg-black">

<!-- Phone Container -->
<main class="w-full max-w-[392px] h-screen sm:h-[844px] bg-[#121316] sm:rounded-[44px] shadow-2xl relative flex flex-col justify-between overflow-hidden border border-neutral-800/60 select-none">

  <!-- TOP PULL HANDLE (Pull down or click to open Control Center) -->
  <div id="top-status-bar" class="w-full pt-3 pb-1 flex flex-col items-center justify-center select-none cursor-pointer group z-30 transition-colors" title="Drag down or click to open Control Center" onclick="openControlCenter()">
    <div class="w-10 h-1 bg-white/20 group-hover:bg-[#7CAEFF] rounded-full transition-colors duration-200"></div>
  </div>

  <!-- SLIDING CONTROL CENTER OVERLAY -->
  <div id="control-center-drawer" class="absolute inset-0 bg-[#121316] z-50 transform -translate-y-full transition-transform duration-300 ease-out flex flex-col justify-between overflow-hidden shadow-2xl">
    <iframe id="cc-iframe" src="/screens/screen-8-control-center-quick-settings/" class="w-full h-full border-none"></iframe>
  </div>

  <!-- TOP NAVIGATION: Back to Settings & Skip button -->
  <header class="w-full flex justify-between items-center px-6 pt-3 pb-1 z-20">
    <a href="/screens/screen-2-settings-family-mode/" aria-label="Go back to Settings" class="p-1 -ml-1 text-neutral-300 hover:text-white transition active:scale-95">
      <svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <a href="/screens/screen-3-family-mode-set-duration/" aria-label="Skip to duration setup" class="text-[14px] font-normal text-[#8AB4F8] hover:text-white transition">
      Skip
    </a>
  </header>

  <!-- MAIN ONBOARDING CONTENT (Original screen content) -->
  <div class="flex-1 flex flex-col justify-center px-7 -mt-2">
    
    <!-- Minimal Hero Family Graphic -->
    <div class="w-full flex items-center justify-center mb-6">
      <div class="w-28 h-28 rounded-full bg-[#1A1D21] border border-neutral-800/80 flex items-center justify-center">
        <svg class="w-14 h-14 text-[#7CAEFF] stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 100 100">
          <polyline points="20,42 50,18 80,42"/>
          <line x1="26" x2="26" y1="38" y2="64"/>
          <line x1="23" x2="40" y1="64" y2="64"/>
          <circle cx="48" cy="46" r="6"/>
          <path d="M38,64 C38,55.5 42.5,54.5 48,54.5 C53.5,54.5 58,55.5 58,64"/>
          <circle cx="63" cy="50" r="5"/>
          <path d="M55,64 C55,59 58.5,58 63,58 C67.5,58 71,59 71,64"/>
        </svg>
      </div>
    </div>

    <!-- Title & Subtitle (Original text) -->
    <section class="text-center mb-8">
      <h1 class="text-[32px] font-normal text-white tracking-tight leading-tight mb-2">
        Family Mode
      </h1>
      <p class="text-[15px] font-normal text-[#A0A4A8]">
        Stay present with your loved ones.
      </p>
    </section>

    <!-- 3 Feature Benefits (Original content) -->
    <section class="w-full space-y-5">
      
      <!-- Feature 1: Silence distractions -->
      <article class="flex items-start gap-4">
        <div class="w-11 h-11 rounded-full bg-[#1A1D21] border border-neutral-800/80 flex items-center justify-center flex-shrink-0 text-[#7CAEFF]">
          <svg class="w-5 h-5 stroke-current fill-none stroke-[2]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect height="18" rx="2" width="14" x="5" y="3"/>
            <path d="M9 13l2 2 4-4"/>
          </svg>
        </div>
        <div class="flex-1 pt-0.5">
          <h2 class="text-[15px] font-normal text-white">Silence distractions</h2>
          <p class="text-[13px] text-[#8C9094] mt-0.5">Pause notifications and non-urgent calls.</p>
        </div>
      </article>

      <!-- Feature 2: Stay connected -->
      <article class="flex items-start gap-4">
        <div class="w-11 h-11 rounded-full bg-[#1A1D21] border border-neutral-800/80 flex items-center justify-center flex-shrink-0 text-[#7CAEFF]">
          <svg class="w-5 h-5 stroke-current fill-none stroke-[2]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="flex-1 pt-0.5">
          <h2 class="text-[15px] font-normal text-white">Stay connected</h2>
          <p class="text-[13px] text-[#8C9094] mt-0.5">Allow calls and messages from selected people.</p>
        </div>
      </article>

      <!-- Feature 3: Be available for important calls -->
      <article class="flex items-start gap-4">
        <div class="w-11 h-11 rounded-full bg-[#1A1D21] border border-neutral-800/80 flex items-center justify-center flex-shrink-0 text-[#7CAEFF]">
          <svg class="w-5 h-5 stroke-current fill-none stroke-[2]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div class="flex-1 pt-0.5">
          <h2 class="text-[15px] font-normal text-white">Be available for important calls</h2>
          <p class="text-[13px] text-[#8C9094] mt-0.5">Emergency calls always come through.</p>
        </div>
      </article>

    </section>

  </div>

  <!-- BOTTOM ACTION (Minimal Deep Blue Pill Button) -->
  <footer class="w-full px-6 pt-2 pb-3">
    <a href="/screens/screen-3-family-mode-set-duration/" aria-label="Get Started with Family Mode" class="w-full py-3.5 rounded-full bg-[#004F7C] hover:bg-[#005E94] active:scale-95 text-white text-[15.5px] font-medium transition shadow-sm flex items-center justify-center text-decoration-none border border-[#7CAEFF]/30">
      Get Started
    </a>

    <!-- Bottom Gesture Home Bar -->
    <div class="w-36 h-1 bg-[#4A4E54] rounded-full mx-auto mt-4"></div>
  </footer>

</main>

<script>
  function openControlCenter() {
    const drawer = document.getElementById('control-center-drawer');
    if (drawer) {
      drawer.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      drawer.classList.remove('-translate-y-full');
      drawer.classList.add('translate-y-0');
      drawer.style.transform = '';
    }
  }

  function closeControlCenter() {
    const drawer = document.getElementById('control-center-drawer');
    if (drawer) {
      drawer.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
      drawer.classList.remove('translate-y-0');
      drawer.classList.add('-translate-y-full');
      drawer.style.transform = '';
    }
  }

  window.addEventListener('message', (e) => {
    if (e.data === 'close-control-center') {
      closeControlCenter();
    } else if (e.data && e.data.action === 'open-family-mode') {
      closeControlCenter();
      // If already on screen 1, provide subtle visual confirmation
      const heroGraphic = document.querySelector('polyline');
      if (heroGraphic) {
        heroGraphic.classList.add('animate-pulse');
        setTimeout(() => heroGraphic.classList.remove('animate-pulse'), 1200);
      }
    }
  });

  // Touch & Mouse Drag Down Gestures
  (function initDrag() {
    const statusBar = document.getElementById('top-status-bar');
    const drawer = document.getElementById('control-center-drawer');
    const mainEl = document.querySelector('main');
    if (!statusBar || !drawer || !mainEl) return;

    let isDragging = false;
    let startY = 0;

    function onStart(clientY) {
      isDragging = true;
      startY = clientY;
      drawer.style.transition = 'none';
    }

    function onMove(clientY) {
      if (!isDragging) return;
      const diff = clientY - startY;
      if (diff > 0) {
        const h = mainEl.clientHeight || 844;
        const translateY = Math.min(0, -h + diff);
        drawer.style.transform = `translateY(${translateY}px)`;
      }
    }

    function onEnd(clientY) {
      if (!isDragging) return;
      isDragging = false;
      const diff = clientY - startY;
      if (diff > 60) {
        openControlCenter();
      } else {
        closeControlCenter();
      }
    }

    statusBar.addEventListener('touchstart', (e) => onStart(e.touches[0].clientY), { passive: true });
    window.addEventListener('touchmove', (e) => { if (isDragging) onMove(e.touches[0].clientY); }, { passive: true });
    window.addEventListener('touchend', (e) => { if (isDragging) onEnd(e.changedTouches[0].clientY); }, { passive: true });

    statusBar.addEventListener('mousedown', (e) => {
      onStart(e.clientY);
      function onMouseMove(ev) { onMove(ev.clientY); }
      function onMouseUp(ev) {
        onEnd(ev.clientY);
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      }
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeControlCenter();
      if (e.key.toLowerCase() === 'c') openControlCenter();
    });
  })();
</script>

</body>
</html>
