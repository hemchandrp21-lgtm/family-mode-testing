<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>Phone Home Screen</title>
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared-interactions.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    ::-webkit-scrollbar,
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }
    html, body, * {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* App Icon Styling */
    .app-icon-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app-icon-wrap:active {
      transform: scale(0.92);
    }
    .app-squircle {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }

    /* Active Mode Floating Banner */
    .family-mode-chip {
      background: rgba(0, 79, 124, 0.85);
      border: 1px solid rgba(124, 174, 255, 0.5);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 79, 124, 0.4), 0 0 12px rgba(124, 174, 255, 0.25);
      transition: all 0.24s ease;
    }
    .family-mode-chip:hover {
      background: rgba(0, 94, 148, 0.95);
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 bg-black select-none">

<!-- Phone Frame Container -->
<main class="w-full max-w-[392px] h-screen sm:h-[844px] bg-[#101114] sm:rounded-[44px] shadow-2xl relative flex flex-col justify-between overflow-hidden border border-neutral-800/80 select-none">

  <!-- ==========================================
       CINEMATIC BATTLEFIELD WALLPAPER
       Matching the user's authentic phone wallpaper
       ========================================== -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
    <svg class="w-full h-full object-cover" viewBox="0 0 392 844" fill="none" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Dusky Atmospheric Sky Gradient -->
        <linearGradient id="skyGrad" x1="196" y1="0" x2="196" y2="844" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#4B4B48"/>
          <stop offset="25%" stop-color="#3A3835"/>
          <stop offset="45%" stop-color="#2D2A26"/>
          <stop offset="65%" stop-color="#231F1C"/>
          <stop offset="100%" stop-color="#141110"/>
        </linearGradient>

        <!-- Golden Backlit Dust Storm Radial Gradient -->
        <radialGradient id="dustGlow" cx="210" cy="550" r="220" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#D49B61" stop-opacity="0.95"/>
          <stop offset="40%" stop-color="#B27A45" stop-opacity="0.75"/>
          <stop offset="70%" stop-color="#735133" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#2D2A26" stop-opacity="0"/>
        </radialGradient>

        <!-- Mist Layers -->
        <radialGradient id="mistGlow" cx="160" cy="580" r="180" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#E2B27E" stop-opacity="0.8"/>
          <stop offset="55%" stop-color="#9A6F46" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#231F1C" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Background Sky -->
      <rect width="392" height="844" fill="url(#skyGrad)"/>

      <!-- Golden Backlit Dust Storm Cloud -->
      <circle cx="210" cy="540" r="190" fill="url(#dustGlow)"/>
      <ellipse cx="180" cy="580" rx="210" ry="140" fill="url(#mistGlow)"/>

      <!-- Flying Arrow Trajectories in Dust (Angled lines) -->
      <line x1="130" y1="460" x2="140" y2="520" stroke="#1A1816" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
      <line x1="215" y1="450" x2="220" y2="510" stroke="#1A1816" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
      <line x1="310" y1="465" x2="300" y2="525" stroke="#1A1816" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
      <line x1="335" y1="490" x2="320" y2="540" stroke="#1A1816" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
      <line x1="75" y1="480" x2="85" y2="530" stroke="#1A1816" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

      <!-- Giant Ancient War Chariot Spiked Wheel Silhouette -->
      <g transform="translate(210, 540)" opacity="0.88">
        <!-- Outer Tire Rim -->
        <circle cx="0" cy="0" r="42" stroke="#171513" stroke-width="5.5" fill="none"/>
        <circle cx="0" cy="0" r="36" stroke="#1F1C18" stroke-width="2.5" fill="none"/>
        <!-- Central Hub -->
        <circle cx="0" cy="0" r="12" fill="#171513"/>
        <circle cx="0" cy="0" r="6" fill="#D49B61" opacity="0.7"/>
        <!-- 8 Spokes -->
        <line x1="-36" y1="0" x2="36" y2="0" stroke="#171513" stroke-width="4.5"/>
        <line x1="0" y1="-36" x2="0" y2="36" stroke="#171513" stroke-width="4.5"/>
        <line x1="-25" y1="-25" x2="25" y2="25" stroke="#171513" stroke-width="4.5"/>
        <line x1="-25" y1="25" x2="25" y2="-25" stroke="#171513" stroke-width="4.5"/>
      </g>

      <!-- Charging Warriors Silhouettes & Spears -->
      <!-- Left Warriors -->
      <path d="M-10 650 Q30 630 60 660 Q80 640 100 680 L120 720 L-10 730 Z" fill="#141110"/>
      <circle cx="50" cy="625" r="9" fill="#141110"/>
      <circle cx="95" cy="635" r="8" fill="#141110"/>
      <!-- Warrior arms / spears -->
      <line x1="45" y1="630" x2="110" y2="610" stroke="#141110" stroke-width="3" stroke-linecap="round"/>

      <!-- Center-Right Warriors Charging Through Water / Dust Splash -->
      <path d="M160 670 Q190 640 215 675 Q235 635 270 665 Q300 645 350 670 L392 720 L150 720 Z" fill="#141110"/>
      <circle cx="210" cy="640" r="8" fill="#141110"/>
      <circle cx="270" cy="642" r="8" fill="#141110"/>
      <circle cx="330" cy="648" r="8" fill="#141110"/>
      <line x1="260" y1="645" x2="210" y2="620" stroke="#141110" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="320" y1="645" x2="365" y2="615" stroke="#141110" stroke-width="2.8" stroke-linecap="round"/>

      <!-- Splashes & Rocks -->
      <circle cx="170" cy="690" r="3" fill="#B27A45" opacity="0.7"/>
      <circle cx="185" cy="675" r="2.5" fill="#E2B27E" opacity="0.8"/>
      <circle cx="230" cy="695" r="3" fill="#B27A45" opacity="0.6"/>
      <circle cx="280" cy="685" r="2" fill="#E2B27E" opacity="0.75"/>
      <circle cx="295" cy="700" r="3.5" fill="#B27A45" opacity="0.6"/>

      <!-- Dark Muddy Terrain Base -->
      <rect x="0" y="700" width="392" height="144" fill="#13100F"/>
      <path d="M0 700 Q100 690 200 705 Q300 692 392 702 V844 H0 Z" fill="#0E0C0B"/>
    </svg>
  </div>

  <!-- TOP PULL HANDLE (Swipe down or click to open Control Center Quick Settings) -->
  <div id="top-status-bar" class="w-full pt-3 pb-1 flex flex-col items-center justify-center select-none cursor-pointer group z-30 transition-colors" title="Swipe down to open Control Center" onclick="openControlCenter()">
    <div class="w-10 h-1 bg-white/30 group-hover:bg-[#7CAEFF] rounded-full transition-colors duration-200"></div>
  </div>

  <!-- SLIDING CONTROL CENTER OVERLAY -->
  <div id="control-center-drawer" class="absolute inset-0 bg-[#121316] z-50 transform -translate-y-full transition-transform duration-300 ease-out flex flex-col justify-between overflow-hidden shadow-2xl">
    <iframe id="cc-iframe" src="/screens/screen-8-control-center-quick-settings/" class="w-full h-full border-none"></iframe>
  </div>

  <!-- ==========================================
       TOP STATUS BAR (Real Time & Phone Icons)
       ========================================== -->
  <div class="relative z-20 w-full px-6 pt-0.5 pb-2 flex items-center justify-between text-white text-[13px] font-medium">
    <!-- Left: Real Time + YouTube Icon -->
    <div class="flex items-center gap-2">
      <span id="status-live-time" class="font-medium tracking-tight">11:20</span>
      <!-- YouTube App Notification Badge -->
      <div class="w-4 h-3 rounded-[3px] bg-[#FF0000] flex items-center justify-center p-[1px] shadow-sm">
        <svg class="w-2.5 h-2 fill-white ml-[1px]" viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </div>
    </div>

    <!-- Right: Alarm, Vibration, 4G, WiFi, Battery 80% -->
    <div class="flex items-center gap-1.5 text-white/95">
      <!-- Alarm Glyph -->
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
        <path d="M12 22c4.97 0 9-4.03 9-9s-4.03-9-9-9-9 4.03-9 9 4.03 9 9 9zm0-16c3.87 0 7 3.13 7 7s-3.13 7-7 7-7-3.13-7-7 3.13-7 7-7zm1 3h-2v5l4.25 2.52.77-1.28-3.52-2.09V9zM22 5.72l-4.6-3.86-1.29 1.53 4.6 3.86L22 5.72zM7.88 3.39L6.6 1.86 2 5.71l1.29 1.53 4.59-3.85z"/>
      </svg>

      <!-- Vibration / Silent Glyph -->
      <svg class="w-3.5 h-3.5 stroke-current stroke-[2] fill-none" viewBox="0 0 24 24">
        <rect x="7" y="4" width="10" height="16" rx="2"/>
        <line x1="2" y1="8" x2="2" y2="16"/>
        <line x1="22" y1="8" x2="22" y2="16"/>
      </svg>

      <!-- 4G VoLTE Signal -->
      <div class="flex items-center gap-0.5">
        <span class="text-[9.5px] font-bold tracking-tighter">4G</span>
        <svg class="w-3.5 h-3 fill-current" viewBox="0 0 16 12">
          <rect x="0" y="8" width="2.5" height="4" rx="0.5"/>
          <rect x="4" y="5" width="2.5" height="7" rx="0.5"/>
          <rect x="8" y="2.5" width="2.5" height="9.5" rx="0.5"/>
          <rect x="12" y="0" width="2.5" height="12" rx="0.5"/>
        </svg>
      </div>

      <!-- Wi-Fi Waves -->
      <svg class="w-3.5 h-3 fill-current" viewBox="0 0 16 12">
        <path d="M8 2.5a9.8 9.8 0 0 1 6.8 2.7l1.2-1.2A11.5 11.5 0 0 0 0 4l1.2 1.2A9.8 9.8 0 0 1 8 2.5zm0 3.6a6.5 6.5 0 0 1 4.5 1.8l1.2-1.2A8.2 8.2 0 0 0 2.3 6.7l1.2 1.2A6.5 6.5 0 0 1 8 6.1zm0 3.7c1.3 0 2.4.5 3.3 1.3l1.2-1.2a6 6 0 0 0-9 0l1.2 1.2c.9-.8 2-1.3 3.3-1.3z"/>
      </svg>

      <!-- Battery Percentage & Icon -->
      <span class="text-[11.5px] font-medium ml-0.5">80%</span>
      <div class="w-[19px] h-[10px] border-[1.4px] border-white rounded-[3px] p-[1px] relative flex items-center">
        <div class="w-[80%] h-full bg-white rounded-[1px]"></div>
        <div class="absolute -right-[2.5px] top-[1.5px] w-[1.5px] h-[3.5px] bg-white rounded-r-[1px]"></div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       TOP GOOGLE SEARCH BAR WIDGET
       ========================================== -->
  <div class="relative z-10 w-full px-6 pt-3">
    <div class="w-full h-12 rounded-full bg-[#252830]/85 backdrop-blur-md border border-white/10 px-4 flex items-center justify-between shadow-lg cursor-pointer" onclick="handleSearchClick()">
      <!-- Google Multi-color 'G' -->
      <div class="w-6 h-6 flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
      </div>

      <!-- Right Action Icons: Gemini Sparkle, Microphone, Google Lens -->
      <div class="flex items-center gap-3.5 text-white/85">
        <!-- Gemini AI Sparkle -->
        <svg class="w-4 h-4 fill-current text-white/90" viewBox="0 0 24 24">
          <path d="M12 2L13.8 8.2L20 10L13.8 11.8L12 18L10.2 11.8L4 10L10.2 8.2L12 2Z"/>
          <circle cx="19" cy="4" r="1.5"/>
        </svg>
        <!-- Mic -->
        <svg class="w-4 h-4 fill-current text-white/90" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <!-- Google Lens Camera -->
        <svg class="w-4 h-4 stroke-current stroke-[2] fill-none text-white/90" viewBox="0 0 24 24">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- ==========================================
       CENTER CLOCK & DATE WIDGET (Dynamic Live Time)
       ========================================== -->
  <div class="relative z-10 w-full flex flex-col items-center justify-center pt-8 pb-4 text-center">
    <!-- Live Real Date: Wednesday, Oct 28 -->
    <span id="widget-live-date" class="text-[16px] font-normal text-white/90 tracking-wide drop-shadow-md">
      Wednesday, Oct 28
    </span>

    <!-- Big Clock: 11:20 (Thin, clean, elegant Roboto font) -->
    <h1 id="widget-live-clock" class="text-[68px] sm:text-[76px] font-light text-white leading-none tracking-tight mt-1.5 drop-shadow-[0_4px_18px_rgba(0,0,0,0.7)] font-['Roboto']">
      11:20
    </h1>

    <!-- Family Mode Active Status Pill (if active) -->
    <div id="home-family-mode-banner" class="mt-4 hidden" onclick="window.smoothNavigate('/screens/screen-9-family-mode-active-status/', 'forward')">
      <div class="family-mode-chip px-3.5 py-1.5 rounded-full flex items-center gap-2 cursor-pointer">
        <span class="w-2 h-2 rounded-full bg-[#7CAEFF] animate-pulse"></span>
        <span class="text-[12px] font-medium text-white">Family Mode Active</span>
        <span class="text-[11px] text-[#7CAEFF]">&bull; Manage &rarr;</span>
      </div>
    </div>
  </div>

  <!-- Spacer to push app icons down nicely over the chariot wheel -->
  <div class="flex-1"></div>

  <!-- ==========================================
       MAIN APP ICONS GRID (5 Apps matching user screenshot)
       ========================================== -->
  <div class="relative z-10 w-full px-4 pb-4">
    <div class="grid grid-cols-5 gap-2 justify-items-center">

      <!-- 1. iManager (Settings / Mode Hub) -->
      <div class="app-icon-wrap" onclick="window.smoothNavigate('/screens/screen-2-settings-family-mode/', 'forward')" title="Open System Settings / Family Mode">
        <div class="app-squircle bg-gradient-to-tr from-[#00A859] to-[#00DE7A]">
          <!-- 3D Cyan Shield Cube -->
          <svg class="w-8 h-8 text-white stroke-current fill-white/20 stroke-[2]" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <span class="text-[11.5px] font-normal text-white/95 text-center drop-shadow-md">iManager</span>
      </div>

      <!-- 2. Browser -->
      <div class="app-icon-wrap" onclick="window.showOriginToast('Browser App', 'info')">
        <div class="app-squircle bg-gradient-to-tr from-[#0066FF] to-[#00A3FF]">
          <!-- Planet with Ring -->
          <svg class="w-8 h-8 text-white fill-white" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="6"/>
            <ellipse cx="12" cy="12" rx="10" ry="3.5" fill="none" stroke="white" stroke-width="2" transform="rotate(-30 12 12)"/>
          </svg>
        </div>
        <span class="text-[11.5px] font-normal text-white/95 text-center drop-shadow-md">Browser</span>
      </div>

      <!-- 3. Weather -->
      <div class="app-icon-wrap" onclick="window.showOriginToast('Weather: 28°C Clear', 'info')">
        <div class="app-squircle bg-gradient-to-tr from-[#1E88E5] to-[#42A5F5]">
          <!-- Sun & Cloud -->
          <svg class="w-8 h-8" viewBox="0 0 24 24">
            <circle cx="15.5" cy="8.5" r="4.5" fill="#FFC107"/>
            <path d="M17.5 17a4.5 4.5 0 0 0 .5-8.97 6 6 0 0 0-11.5 1.97A4.5 4.5 0 0 0 7 19h10.5z" fill="#FFFFFF"/>
          </svg>
        </div>
        <span class="text-[11.5px] font-normal text-white/95 text-center drop-shadow-md">Weather</span>
      </div>

      <!-- 4. Play Store -->
      <div class="app-icon-wrap" onclick="window.showOriginToast('Google Play Store', 'info')">
        <div class="app-squircle bg-white">
          <!-- Play Store Triangle -->
          <svg class="w-7 h-7" viewBox="0 0 24 24">
            <path d="M4.5 3.5L14 12l-9.5 8.5V3.5z" fill="#00C3FF"/>
            <path d="M14 12l3.5-3.5L4.5 3.5 14 12z" fill="#00E676"/>
            <path d="M17.5 8.5l3.2 2c.9.5.9 1.5 0 2l-3.2 2-3.5-2.5 3.5-3.5z" fill="#FFD600"/>
            <path d="M14 12l-9.5 8.5L17.5 15.5 14 12z" fill="#FF334B"/>
          </svg>
        </div>
        <span class="text-[11.5px] font-normal text-white/95 text-center drop-shadow-md">Play Store</span>
      </div>

      <!-- 5. Google Folder -->
      <div class="app-icon-wrap" onclick="window.showOriginToast('Google Apps Folder', 'info')">
        <div class="app-squircle bg-[#353942]/65 backdrop-blur-md border border-white/10 p-2">
          <!-- 3x3 Mini Icons Grid -->
          <div class="grid grid-cols-3 gap-1 w-full h-full items-center justify-items-center">
            <div class="w-2.5 h-2.5 rounded-full bg-[#EA4335]"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-[#4285F4]"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-[#FBBC05]"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-[#34A853]"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-[#FF0000]"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-[#4285F4]"></div>
          </div>
        </div>
        <span class="text-[11.5px] font-normal text-white/95 text-center drop-shadow-md">Google</span>
      </div>

    </div>

    <!-- Carousel Page Indicator Dots (• • • •) -->
    <div class="flex items-center justify-center gap-1.5 mt-3 mb-1">
      <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-white shadow-sm"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
      <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
    </div>
  </div>

  <!-- ==========================================
       BOTTOM DOCK (5 Favorite Apps: Phone, Messages, Chrome, Gallery, Camera)
       ========================================== -->
  <div class="relative z-10 w-full px-4 pb-2">
    <div class="grid grid-cols-5 gap-2 justify-items-center items-center">

      <!-- 1. Phone / Dialer -->
      <div class="app-icon-wrap" onclick="window.showOriginToast('Phone Dialer', 'info')">
        <div class="app-squircle bg-gradient-to-tr from-[#00C853] to-[#69F0AE]">
          <svg class="w-7 h-7 fill-white" viewBox="0 0 24 24">
            <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
        </div>

      <!-- 2. Messages -->
      <div class="app-icon-wrap" onclick="window.showOriginToast('Messages App', 'info')">
        <div class="app-squircle bg-white">
          <div class="w-10 h-10 rounded-full bg-[#1A73E8] flex items-center justify-center">

      <!-- 3. Chrome -->
      <div class="app-icon-wrap" onclick="window.showOriginToast('Google Chrome', 'info')">

            <circle cx="12" cy="12" r="5" fill="#4285F4"/>
            <path d="M12 2a10 10 0 0 0-8.66 5l4.33 7.5A5 5 0 0 1 12 7h8.66A10 10 0 0 0 12 2z" fill="#EA4335"/>
            <path d="M22 12a10 10 0 0 0-1.34-5H12a5 5 0 0 1 4.33 2.5L12 17l4.33 7.5A10 10 0 0 0 22 12z" fill="#FBBC05"/>

      <!-- 4. Gallery / Photos -->
      <div class="app-icon-wrap" onclick="window.showOriginToast('Photos & Gallery', 'info')">
        <div class="app-squircle bg-gradient-to-tr from-[#0089FF] to-[#00E5FF]">
          <!-- OriginOS Mountain Curves & Sun -->
          <svg class="w-8 h-8 fill-white" viewBox="0 0 24 24">
            <circle cx="18" cy="7" r="2.5" fill="#FFFFFF"/>

      <div class="app-icon-wrap" onclick="window.showOriginToast('Camera App', 'info')">

  <!-- ==========================================
       BOTTOM HOME GESTURE BAR
       ========================================== -->

  </div>

</main>

<script>
  // ==========================================
  // REAL TIME & DATE SYNCHRONIZER
  // Matches exact real time and date live every second
  // ==========================================
  function syncLiveRealTime() {
    const now = new Date();
    
    // Time formatted as HH:mm
    let hours = now.getHours();
    let minutes = now.getMinutes();
    const timeStr = `${hours}:${minutes < 10 ? '0' : ''}${minutes}`;
    
    // Status bar clock
    const statusTimeEl = document.getElementById('status-live-time');
    if (statusTimeEl) statusTimeEl.innerText = timeStr;

    // Big Center Clock
    const widgetClockEl = document.getElementById('widget-live-clock');
    if (widgetClockEl) widgetClockEl.innerText = timeStr;

    // Date formatted as "Wednesday, Oct 28"
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    
    const dayName = days[now.getDay()];
    const monthName = months[now.getMonth()];
    const dateNum = now.getDate();
    const dateStr = `${dayName}, ${monthName} ${dateNum}`;

    const widgetDateEl = document.getElementById('widget-live-date');
    if (widgetDateEl) widgetDateEl.innerText = dateStr;
  }

  // Update immediately and then every second
  syncLiveRealTime();
  setInterval(syncLiveRealTime, 1000);

  // Check if Family Mode is active and show status chip
  function checkFamilyModeState() {
    const isActive = localStorage.getItem('familyModeActive') === 'true';
    const banner = document.getElementById('home-family-mode-banner');
    if (banner) {
      if (isActive) {
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }
  }
  checkFamilyModeState();

  // Control Center Drawer Interactions
  const drawer = document.getElementById('control-center-drawer');
  let isDrawerOpen = false;

  function openControlCenter() {
    isDrawerOpen = true;
    drawer.classList.remove('-translate-y-full');
    drawer.classList.add('translate-y-0');
    if (window.OriginHaptics) window.OriginHaptics.toggleOn();
  }

  function closeControlCenter() {
    isDrawerOpen = false;
    drawer.classList.add('-translate-y-full');
    drawer.classList.remove('translate-y-0');
    if (window.OriginHaptics) window.OriginHaptics.toggleOff();
    checkFamilyModeState();
  }

  // Handle messages from iframe
  window.addEventListener('message', (event) => {
    if (event.data === 'close-control-center') {
      closeControlCenter();
    } else if (event.data && event.data.action === 'open-family-mode') {
      closeControlCenter();
      const target = event.data.screen || '/screens/screen-9-family-mode-active-status/';
      window.smoothNavigate(target, 'forward');
    }
  });

  // Pull down touch gesture from top handle
  let touchStartY = 0;
  window.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    const diff = e.changedTouches[0].clientY - touchStartY;
    if (touchStartY < 90 && diff > 45) {
      openControlCenter();
    }
  }, { passive: true });

  function handleSearchClick() {
    if (window.showOriginToast) {
      window.showOriginToast('Google Search', 'info');
    }
  }
</script>
